<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わたしの習慣トラッカー</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 24px 28px;
    width: 100%;
    max-width: 360px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
  }
  .date {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    align-items: center;
    padding: 12px 8px;
    border-bottom: 1px solid #eee;
  }
  li:last-child {
    border-bottom: none;
  }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    cursor: pointer;
  }
  label {
    font-size: 16px;
    cursor: pointer;
    user-select: none;
  }
  li.done label {
    text-decoration: line-through;
    color: #aaa;
  }
  .summary {
    margin-bottom: 16px;
    text-align: center;
    font-size: 14px;
    color: #666;
  }
  .chart-title {
    margin-top: 24px;
    margin-bottom: 8px;
    font-size: 14px;
    color: #666;
    text-align: center;
  }
  .chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 100px;
    border-bottom: 1px solid #eee;
    padding-bottom: 4px;
  }
  .bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    flex: 1;
    height: 100%;
  }
  .bar {
    width: 16px;
    min-height: 2px;
    display: flex;
    flex-direction: column-reverse;
    background: #eee;
    border-radius: 4px 4px 0 0;
    overflow: hidden;
  }
  .bar.today {
    outline: 2px solid #1a73e8;
    outline-offset: 1px;
  }
  .bar-segment {
    flex: 1;
  }
  .bar-label {
    margin-top: 4px;
    font-size: 11px;
    color: #999;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    margin-top: 12px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    font-size: 12px;
    color: #666;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>わたしの習慣トラッカー</h1>
    <div class="date" id="today"></div>
    <div class="summary" id="summary"></div>
    <ul id="habit-list">
      <li>
        <input type="checkbox" id="exercise">
        <label for="exercise">運動</label>
      </li>
      <li>
        <input type="checkbox" id="reading">
        <label for="reading">読書</label>
      </li>
      <li>
        <input type="checkbox" id="sleep">
        <label for="sleep">早寝</label>
      </li>
      <li>
        <input type="checkbox" id="study">
        <label for="study">勉強</label>
      </li>
      <li>
        <input type="checkbox" id="housework">
        <label for="housework">家事</label>
      </li>
      <li>
        <input type="checkbox" id="childcare">
        <label for="childcare">育児</label>
      </li>
    </ul>
    <div class="chart-title">直近7日間の達成</div>
    <div class="chart" id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>

<script>
  const habits = ["exercise", "reading", "sleep", "study", "housework", "childcare"];
  const habitLabels = {
    exercise: "運動",
    reading: "読書",
    sleep: "早寝",
    study: "勉強",
    housework: "家事",
    childcare: "育児",
  };
  const habitColors = {
    exercise: "#4285f4",
    reading: "#34a853",
    sleep: "#fbbc05",
    study: "#ea4335",
    housework: "#a142f4",
    childcare: "#00acc1",
  };
  const todayKey = new Date().toISOString().slice(0, 10);
  const storageKey = "habit-tracker-" + todayKey;

  document.getElementById("today").textContent = todayKey;

  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");

  function updateSummary() {
    const checkedCount = habits.filter(id => document.getElementById(id).checked).length;
    document.getElementById("summary").textContent = `今日の達成：${checkedCount} / ${habits.length}`;
  }

  function getDailyCheckedHabits(dateKey) {
    const data = JSON.parse(localStorage.getItem("habit-tracker-" + dateKey) || "{}");
    return habits.filter(id => data[id]);
  }

  function getDailyCount(dateKey) {
    return getDailyCheckedHabits(dateKey).length;
  }

  function getLast7DaysData() {
    const result = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateKey = d.toISOString().slice(0, 10);
      const label = `${d.getMonth() + 1}/${d.getDate()}`;
      const checkedHabits = getDailyCheckedHabits(dateKey);
      result.push({ date: dateKey, label, count: checkedHabits.length, checkedHabits });
    }
    return result;
  }

  function renderChart() {
    const chartEl = document.getElementById("chart");
    chartEl.innerHTML = "";
    getLast7DaysData().forEach(item => {
      const wrap = document.createElement("div");
      wrap.className = "bar-wrap";

      const bar = document.createElement("div");
      bar.className = "bar" + (item.date === todayKey ? " today" : "");
      bar.style.height = `${(item.count / habits.length) * 100}%`;

      item.checkedHabits.forEach(id => {
        const segment = document.createElement("div");
        segment.className = "bar-segment";
        segment.style.background = habitColors[id];
        bar.appendChild(segment);
      });

      const label = document.createElement("div");
      label.className = "bar-label";
      label.textContent = item.label;

      wrap.appendChild(bar);
      wrap.appendChild(label);
      chartEl.appendChild(wrap);
    });
  }

  function renderLegend() {
    const legendEl = document.getElementById("legend");
    legendEl.innerHTML = "";
    habits.forEach(id => {
      const item = document.createElement("div");
      item.className = "legend-item";

      const dot = document.createElement("span");
      dot.className = "legend-dot";
      dot.style.background = habitColors[id];

      item.appendChild(dot);
      item.appendChild(document.createTextNode(habitLabels[id]));
      legendEl.appendChild(item);
    });
  }

  habits.forEach(id => {
    const checkbox = document.getElementById(id);
    checkbox.checked = !!saved[id];
    checkbox.closest("li").classList.toggle("done", checkbox.checked);

    checkbox.addEventListener("change", () => {
      const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
      state[id] = checkbox.checked;
      localStorage.setItem(storageKey, JSON.stringify(state));
      checkbox.closest("li").classList.toggle("done", checkbox.checked);
      updateSummary();
      renderChart();
    });
  });

  updateSummary();
  renderChart();
  renderLegend();
</script>
</body>
</html>
